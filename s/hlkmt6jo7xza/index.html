<style>
:root { --grund: #f3f4f1; --flaeche: #ffffff; --tinte: #1f2427; --gedaempft: #575e64; --linie: #cfd5cd; --akzent: #1f6fa8; --fehler: #b4233a; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--grund); color: var(--tinte);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 1rem; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
form { width: 100%; max-width: 24rem; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; padding: 1.5rem; display: flex; flex-direction: column; gap: 0.9rem; }
h1 { font-size: 1.25rem; margin: 0; }
.marke { height: 24px; width: auto; align-self: flex-start; }
p { margin: 0; color: var(--gedaempft); font-size: 0.9rem; }
label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.85rem; color: var(--gedaempft); }
.zeile { display: flex; gap: 0.5rem; align-items: flex-end; }
.zeile label { flex: 1; min-width: 0; }
input, button { font: inherit; height: 2.5rem; border-radius: 6px; }
input { width: 100%; border: 1px solid var(--linie); padding: 0 0.7rem; background: var(--flaeche); color: var(--tinte); }
button { border: 0; background: var(--akzent); color: #fff; padding: 0 1rem; cursor: pointer; }
button:disabled { opacity: 0.7; cursor: progress; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
#meldung { min-height: 1.4em; font-size: 0.9rem; color: var(--fehler); }
</style>

<script>
(function () {
  var N = JSON.parse(document.getElementById("nutzlast").textContent);
  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  var form = document.getElementById("tor"), knopf = document.getElementById("los"), meldung = document.getElementById("meldung");
  function zuruecksetzen(text) {
    meldung.textContent = text;
    knopf.disabled = false; knopf.textContent = "Öffnen";
    document.getElementById("pw").select();
  }
  // Ohne HTTPS gibt es kein WebCrypto, auch im neuesten Browser. Dann auf die HTTPS-Adresse verweisen
  if (location.protocol === "http:" && !window.isSecureContext) {
    var sicher = "https://" + location.host + location.pathname + location.hash;
    knopf.disabled = true;
    meldung.textContent = "Bitte die sichere Adresse öffnen: ";
    var a = document.createElement("a"); a.href = sicher; a.textContent = sicher; meldung.appendChild(a);
    return;
  }
  if (!(window.crypto && crypto.subtle && window.TextEncoder && window.TextDecoder)) {
    meldung.textContent = "Dieser Browser kann die Seite nicht entschlüsseln. Bitte einen aktuellen Browser wie Chrome, Edge, Firefox oder Safari verwenden.";
    knopf.disabled = true;
    return;
  }
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = document.getElementById("pw").value.trim();
    if (!pw) return;
    knopf.disabled = true; knopf.textContent = "Wird geöffnet …"; meldung.textContent = "";
    var falsch = false;
    // Eine durchgehende Kette mit einem catch am Ende: Kein Fehler lässt den Knopf hängen
    Promise.resolve()
      .then(function () { return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]); })
      .then(function (basis) {
        return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: bytes(N.salz), iterations: N.runden },
          basis, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      })
      .then(function (k) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(N.iv) }, k, bytes(N.geheim))
          .catch(function (f) { falsch = true; throw f; });
      })
      .then(function (klar) {
        var html = new TextDecoder().decode(klar);
        document.open(); document.write(html); document.close();
      })
      .catch(function () {
        zuruecksetzen(falsch
          ? "Das Passwort stimmt nicht. Bitte Groß- und Kleinschreibung prüfen und erneut eingeben."
          : "Die Seite ließ sich in diesem Browser nicht öffnen. Bitte einen aktuellen Browser wie Chrome, Edge, Firefox oder Safari verwenden.");
      });
  });
})();
</script>
