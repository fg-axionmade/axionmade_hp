<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Vertraulich · axionmade</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root { --grund: #f3f4f1; --flaeche: #ffffff; --tinte: #1f2427; --gedaempft: #575e64; --linie: #cfd5cd; --akzent: #1f6fa8; --fehler: #b4233a; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--grund); color: var(--tinte);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 1rem; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
form { width: 100%; max-width: 24rem; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; padding: 1.5rem; display: flex; flex-direction: column; gap: 0.9rem; }
h1 { font-size: 1.25rem; margin: 0; }
.marke { height: 24px; width: auto; align-self: flex-start; }
p { margin: 0; color: var(--gedaempft); font-size: 0.9rem; }
label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.85rem; color: var(--gedaempft); }
.zeile { display: flex; gap: 0.5rem; align-items: flex-end; }
.zeile label { flex: 1; min-width: 0; }
input, button { font: inherit; height: 2.5rem; border-radius: 6px; }
/* 16px im Feld: darunter zoomt Safari auf dem iPhone beim Antippen und die Seite springt aus dem Bild */
input { width: 100%; border: 1px solid var(--linie); padding: 0 0.7rem; background: var(--flaeche); color: var(--tinte); font-size: 16px; }
button { border: 0; background: var(--akzent); color: #fff; padding: 0 1rem; cursor: pointer; }
button:disabled { opacity: 0.7; cursor: progress; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
#meldung { min-height: 1.4em; font-size: 0.9rem; color: var(--fehler); }
/* Handy: Knopf unter das Feld, beide volle Breite und 44px hoch; Karte oben statt mittig,
   damit die eingeblendete Tastatur das Feld nicht verdeckt */
@media (max-width: 480px) {
  body { min-height: 100dvh; place-items: start center; padding-top: max(24px, 8vh); padding-bottom: 24px; }
  form { padding: 1.25rem; }
  .zeile { flex-direction: column; align-items: stretch; gap: 0.75rem; }
  input, button { height: 2.75rem; }
  button { width: 100%; }
}
</style>
</head>
<body>
<form id="tor" autocomplete="off">
  <img src="/axionmade-Logo.png" alt="axionmade" width="144" height="24" class="marke">
  <h1>Vertrauliche Seite</h1>
  <p>Diese Seite ist nur für den vorgesehenen Empfänger. Bitte geben Sie das Passwort ein, das Sie mit dem Link erhalten haben.</p>
  <div class="zeile">
    <label for="pw">Passwort
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
    </label>
    <button id="los" type="submit">Öffnen</button>
  </div>
  <div id="meldung" role="alert" aria-live="assertive"></div>
</form>

        return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: bytes(N.salz), iterations: N.runden },
          basis, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      })
      .then(function (k) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(N.iv) }, k, bytes(N.geheim))
          .catch(function (f) { falsch = true; throw f; });
      })
      .then(function (klar) {
        var html = new TextDecoder().decode(klar);
        document.open(); document.write(html); document.close();
      })
      .catch(function () {
        zuruecksetzen(falsch
          ? "Das Passwort stimmt nicht. Bitte Groß- und Kleinschreibung prüfen und erneut eingeben."
          : "Die Seite ließ sich in diesem Browser nicht öffnen. Bitte einen aktuellen Browser wie Chrome, Edge, Firefox oder Safari verwenden.");
      });
  });
})();
